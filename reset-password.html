<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cad2grow Curve — Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#090909;--panel:#151515;--panel2:#1b1b1b;--text:#f5f5f5;--muted:#a6a6a6;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.08)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#1b1b1b 0,#0c0c0c 34%,#050505 100%);color:var(--text)}
    body{display:grid;place-items:center;padding:24px}
    .wrap{width:min(460px,100%)}
    .shell{position:relative;border:1px solid var(--line);border-radius:28px;padding:28px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px)}
    .orb{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
    .orb:before{content:"";width:12px;height:12px;border-radius:50%;background:white;box-shadow:0 0 24px rgba(255,255,255,.75)}
    .eyebrow{margin-top:22px;font-size:12px;letter-spacing:.18em;color:#cfcfcf;font-weight:700}
    h1{font-size:34px;line-height:1.05;margin:8px 0 10px;letter-spacing:-.03em}
    .sub{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:24px}
    label{display:block;font-size:13px;color:#ddd;margin:14px 0 8px;font-weight:600}
    .field{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#101010;color:white;padding:0 15px;font-size:15px;outline:none;transition:.2s}
    .field:focus{border-color:rgba(255,255,255,.35);box-shadow:0 0 0 4px rgba(255,255,255,.05)}
    .btn{width:100%;height:54px;margin-top:20px;border:0;border-radius:15px;background:white;color:#0b0b0b;font-size:15px;font-weight:800;cursor:pointer;transition:.18s;box-shadow:0 9px 28px rgba(255,255,255,.10)}
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .status{display:none;margin-top:16px;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--glass);font-size:14px;line-height:1.45}
    .ok{display:block}.err{display:block}
    .foot{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:#7f7f7f;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="shell">
      <div class="orb"></div>
      <div class="eyebrow">CAD2GROW CURVE</div>
      <h1>Reset your password</h1>
      <div class="sub">Create a new password for your Cad2grow Curve account.</div>

      <label for="password">New password</label>
      <input id="password" class="field" type="password" autocomplete="new-password" minlength="8" placeholder="Minimum 8 characters" />

      <label for="confirm">Confirm password</label>
      <input id="confirm" class="field" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter password" />

      <button id="updateBtn" class="btn">UPDATE PASSWORD</button>
      <div id="status" class="status"></div>

      <div class="foot">Cad2grow Curve · Secure password recovery</div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://rncasurcpgxzgfwbavuo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_CyezUiflsmsbFveWo-mEwA_txwM_a5j';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const btn = document.getElementById('updateBtn');
  const status = document.getElementById('status');
  const password = document.getElementById('password');
  const confirm = document.getElementById('confirm');

  function show(msg, kind='ok'){
    status.className = 'status ' + kind;
    status.textContent = msg;
  }

  client.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      show('Recovery link verified. Enter your new password below.');
    }
  });

  btn.addEventListener('click', async () => {
    const p1 = password.value.trim();
    const p2 = confirm.value.trim();
    if (p1.length < 8) return show('Password must be at least 8 characters.', 'err');
    if (p1 !== p2) return show('Passwords do not match.', 'err');

    btn.disabled = true;
    btn.textContent = 'UPDATING…';
    const { error } = await client.auth.updateUser({ password: p1 });
    if (error) {
      show(error.message || 'Could not update password. Open the reset link from your email again.', 'err');
      btn.disabled = false;
      btn.textContent = 'UPDATE PASSWORD';
      return;
    }

    show('✓ Password updated successfully. You can close this page and sign in to Cad2grow Curve.');
    btn.textContent = 'PASSWORD UPDATED';
  });
</script>
</body>
</html>
